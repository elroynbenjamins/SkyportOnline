name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit --verbose

      - name: Start main scene smoke test
        run: godot --headless --path . --quit-after 3 --verbose

      - name: Test airside connectivity
        run: timeout 20s godot --headless --path . --script res://tests/airside_connectivity_test.gd

      - name: Test flight timer rules
        run: timeout 20s godot --headless --path . --script res://tests/flight_rules_test.gd

      - name: Test resource drop rules
        run: timeout 20s godot --headless --path . --script res://tests/resource_drop_rules_test.gd

      - name: Test passenger economy
        run: timeout 20s godot --headless --path . --script res://tests/passenger_economy_test.gd

      - name: Test building synergy and optimization
        run: timeout 20s godot --headless --path . --script res://tests/building_synergy_test.gd

      - name: Test passenger demand
        run: timeout 20s godot --headless --path . --script res://tests/passenger_demand_test.gd

      - name: Test dynamic route demand
        run: timeout 20s godot --headless --path . --script res://tests/dynamic_demand_test.gd

      - name: Test Priority Contracts
        run: timeout 20s godot --headless --path . --script res://tests/priority_contract_test.gd

      - name: Test World Map passenger demand
        run: timeout 20s godot --headless --path . --script res://tests/world_map_demand_test.gd

      - name: Test economy history
        run: timeout 20s godot --headless --path . --script res://tests/economy_history_test.gd

      - name: Test aircraft mastery
        run: timeout 20s godot --headless --path . --script res://tests/aircraft_mastery_test.gd

      - name: Test Fleet screen
        run: timeout 20s godot --headless --path . --script res://tests/fleet_screen_test.gd

      - name: Test passenger support
        run: timeout 20s godot --headless --path . --script res://tests/passenger_support_test.gd

      - name: Test social airport account and rewards
        run: timeout 20s godot --headless --path . --script res://tests/social_airport_test.gd

      - name: Test social visitor airport cycle
        run: timeout 25s godot --headless --path . --script res://tests/social_aircraft_cycle_test.gd


      - name: Test country selection and resource catalog
        run: timeout 20s godot --headless --path . --script res://tests/country_resource_test.gd


      - name: Test aircraft turnaround rules
        run: timeout 20s godot --headless --path . --script res://tests/turnaround_rules_test.gd


      - name: Test ground service bottlenecks
        run: timeout 20s godot --headless --path . --script res://tests/ground_service_bottleneck_test.gd


      - name: Test service building upgrades
        run: timeout 20s godot --headless --path . --script res://tests/service_upgrade_test.gd


      - name: Test service docking positions
        run: timeout 20s godot --headless --path . --script res://tests/service_docking_test.gd


      - name: Test physical pushback tug
        run: timeout 20s godot --headless --path . --script res://tests/pushback_service_test.gd


      - name: Test taxi motion and stand geometry
        run: timeout 20s godot --headless --path . --script res://tests/taxi_motion_test.gd


      - name: Test apron traffic spacing
        run: timeout 20s godot --headless --path . --script res://tests/apron_traffic_test.gd

      - name: Test event framework
        run: timeout 20s godot --headless --path . --script res://tests/event_framework_test.gd

      - name: Test Winter launch event shop
        run: timeout 20s godot --headless --path . --script res://tests/winter_launch_event_test.gd

      - name: Test physical event visuals
        run: timeout 20s godot --headless --path . --script res://tests/event_visual_presence_test.gd

      - name: Test UI modernization
        run: timeout 20s godot --headless --path . --script res://tests/ui_modernization_test.gd

      - name: Test main airport UI takeover
        run: timeout 20s godot --headless --path . --script res://tests/airport_ui_takeover_test.gd

      - name: Diagnose production building art alignment
        run: timeout 30s godot --headless --path . --script res://tests/building_art_alignment_test.gd

      - name: Test aircraft context card
        run: timeout 20s godot --headless --path . --script res://tests/aircraft_context_card_test.gd

      - name: Test building context card
        run: timeout 20s godot --headless --path . --script res://tests/building_context_card_test.gd

      - name: Test land expansion frontier progression
        run: timeout 20s godot --headless --path . --script res://tests/land_expansion_progression_test.gd

      - name: Test placement-time expansion
        run: timeout 20s godot --headless --path . --script res://tests/placement_expansion_test.gd

      - name: Test airport edit and expansion HUD
        run: timeout 20s godot --headless --path . --script res://tests/airport_edit_hud_test.gd

      - name: Test building move mode
        run: timeout 20s godot --headless --path . --script res://tests/building_move_mode_test.gd

      - name: Test airport layout edit feedback
        run: timeout 20s godot --headless --path . --script res://tests/layout_edit_feedback_test.gd

      - name: Test building storage
        run: timeout 20s godot --headless --path . --script res://tests/building_storage_test.gd


      - name: Test airport expansion districts and visuals
        run: timeout 20s godot --headless --path . --script res://tests/airport_expansion_district_test.gd

      - name: Test airport terrain visuals
        run: timeout 20s godot --headless --path . --script res://tests/terrain_visual_test.gd

      - name: Test landside environment visuals
        run: timeout 20s godot --headless --path . --script res://tests/landside_environment_test.gd

      - name: Test airfield perimeter details
        run: timeout 20s godot --headless --path . --script res://tests/airfield_perimeter_detail_test.gd

      - name: Test apron and terminal micro details
        run: timeout 20s godot --headless --path . --script res://tests/apron_micro_detail_test.gd


      - name: Test aircraft taxi traffic
        run: timeout 20s godot --headless --path . --script res://tests/taxi_traffic_test.gd

      - name: Test ground movement safety
        run: timeout 20s godot --headless --path . --script res://tests/airport_ground_movement_safety_test.gd

      - name: Test complete airport operations cycle
        run: timeout 25s godot --headless --path . --script res://tests/airport_operations_cycle_test.gd


      - name: Test runway hold short and arrival priority
        run: timeout 20s godot --headless --path . --script res://tests/runway_hold_short_test.gd


      - name: Test runway visual controls
        run: timeout 20s godot --headless --path . --script res://tests/runway_visual_control_test.gd


      - name: Test runway throughput pacing
        run: timeout 20s godot --headless --path . --script res://tests/runway_pacing_test.gd


      - name: Test ATC Tower throughput upgrades
        run: timeout 20s godot --headless --path . --script res://tests/atc_tower_upgrade_test.gd


      - name: Test multi-runway assignment
        run: timeout 20s godot --headless --path . --script res://tests/multi_runway_assignment_test.gd


      - name: Test runway operating strategy
        run: timeout 20s godot --headless --path . --script res://tests/runway_strategy_test.gd


      - name: Test runway utilization analytics
        run: timeout 20s godot --headless --path . --script res://tests/runway_analytics_test.gd


      - name: Test airport operations analytics
        run: timeout 20s godot --headless --path . --script res://tests/operations_analytics_test.gd


      - name: Test operations upgrade payoff
        run: timeout 20s godot --headless --path . --script res://tests/operations_payoff_test.gd
