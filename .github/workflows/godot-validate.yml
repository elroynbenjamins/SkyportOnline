name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import project and build script class cache
        shell: bash
        run: |
          set -euo pipefail
          status=0
          godot --headless --path . --import --verbose > /tmp/skyport-import.log 2>&1 || status=$?
          tail -n 60 /tmp/skyport-import.log
          test "$status" -eq 0
          test -s .godot/global_script_class_cache.cfg
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-import.log; then exit 1; fi

      - name: Start main scene smoke test
        run: godot --headless --path . --quit-after 3 --verbose

      - name: Prepare virtual display for runway QA
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb
          fi

      - name: Capture 5x2 small runway
        run: timeout 45s xvfb-run -a godot --path . --display-driver x11 --rendering-method gl_compatibility --script res://tests/capture_short_runway_ingame.gd

      - name: Upload 5x2 small runway screenshot
        uses: actions/upload-artifact@v4
        with:
          name: short-runway-5x2-ingame
          path: artifacts/short_runway_ingame.png
          if-no-files-found: error
          retention-days: 7

      - name: Capture taxiway runway connection
        run: timeout 45s xvfb-run -a godot --path . --display-driver x11 --rendering-method gl_compatibility --script res://tests/capture_taxiway_connection_ingame.gd

      - name: Upload taxiway runway connection
        uses: actions/upload-artifact@v4
        with:
          name: taxiway-runway-connection-ingame
          path: artifacts/taxiway_connection_ingame.png
          if-no-files-found: error
          retention-days: 7

      - name: Validate grid and gameplay systems
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/camera_navigation_test.gd
            tests/building_placement_v2_test.gd
            tests/starter_airport_network_v2_test.gd
            tests/starter_airport_tutorial_test.gd
            tests/starter_building_grid_fit_test.gd
            tests/short_runway_grid_art_test.gd
            tests/taxiway_grid_art_test.gd
            tests/airside_connectivity_test.gd
            tests/flight_rules_test.gd
            tests/resource_drop_rules_test.gd
            tests/passenger_economy_test.gd
            tests/fuel_economy_test.gd
            tests/fuel_upgrade_feedback_test.gd
            tests/building_synergy_test.gd
            tests/passenger_demand_test.gd
            tests/dynamic_demand_test.gd
            tests/priority_contract_test.gd
            tests/world_map_demand_test.gd
            tests/world_map_country_selection_test.gd
            tests/economy_history_test.gd
            tests/aircraft_mastery_test.gd
            tests/aircraft_directional_coverage_test.gd
            tests/fleet_screen_test.gd
            tests/passenger_support_test.gd
            tests/social_airport_test.gd
            tests/social_aircraft_cycle_test.gd
            tests/alliance_operations_test.gd
            tests/airport_challenge_test.gd
            tests/activities_hub_test.gd
            tests/activity_pacing_test.gd
            tests/progression_pacing_test.gd
            tests/dispatch_challenge_test.gd
            tests/country_resource_test.gd
            tests/turnaround_rules_test.gd
            tests/ground_service_bottleneck_test.gd
            tests/service_upgrade_test.gd
            tests/service_docking_test.gd
            tests/mission_pass_rules_test.gd
            tests/event_framework_test.gd
            tests/winter_launch_event_test.gd
            tests/ui_modernization_test.gd
            tests/airport_background_layer_test.gd
            tests/production_ui_skin_test.gd
            tests/aircraft_context_card_test.gd
            tests/building_context_card_test.gd
            tests/land_expansion_progression_test.gd
            tests/airport_expansion_district_test.gd
            tests/expansion_shop_mode_test.gd
            tests/placement_expansion_test.gd
            tests/airport_edit_hud_test.gd
            tests/building_move_mode_test.gd
            tests/layout_edit_feedback_test.gd
            tests/new_build_construction_feedback_test.gd
            tests/building_storage_test.gd
            tests/taxi_traffic_test.gd
            tests/airport_ground_movement_safety_test.gd
            tests/airport_operations_cycle_test.gd
            tests/runway_hold_short_test.gd
            tests/runway_pacing_test.gd
            tests/atc_tower_upgrade_test.gd
            tests/multi_runway_assignment_test.gd
            tests/runway_strategy_test.gd
            tests/runway_analytics_test.gd
            tests/operations_analytics_test.gd
            tests/operations_payoff_test.gd
          )
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            timeout 40s godot --headless --path . --script "res://${test_file}"
            echo "::endgroup::"
          done

      - name: Prepare virtual display for grid QA
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb
          fi

      - name: Capture current grid-first airport
        run: timeout 45s xvfb-run -a godot --path . --display-driver x11 --rendering-method gl_compatibility --script res://tests/capture_airport_screenshot.gd

      - name: Upload current grid-first airport
        uses: actions/upload-artifact@v4
        with:
          name: current-grid-first-airport
          path: artifacts/current_airport.png
          if-no-files-found: error
          retention-days: 7

      - name: Capture footprint contract QA
        run: timeout 60s xvfb-run -a godot --path . --display-driver x11 --rendering-method gl_compatibility --script res://tests/capture_building_grid_qa.gd

      - name: Upload footprint contract QA
        uses: actions/upload-artifact@v4
        with:
          name: footprint-contract-qa
          path: artifacts/building_grid_qa.png
          if-no-files-found: error
          retention-days: 7
