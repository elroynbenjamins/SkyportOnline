name: Apply scoped NPC stability fix
on:
  pull_request:
    paths:
      - '.github/workflows/pass5-source-repair.yml'
      - 'scripts/pass5-runtime-stability.patch'
jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/pass5-npc-career-progression' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pass5-npc-career-progression
          fetch-depth: 0
      - name: Apply tested runtime changes once
        run: |
          if [ ! -f scripts/pass5-runtime-stability.patch ]; then exit 0; fi
          if git apply --reverse --check scripts/pass5-runtime-stability.patch 2>/dev/null; then exit 0; fi
          git apply --check scripts/pass5-runtime-stability.patch
          git apply scripts/pass5-runtime-stability.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/build/BuildingCatalog.gd src/ui/GameUIStyle.gd src/ui/HUD.gd src/services/TaxiTrafficController.gd src/aircraft/AircraftPrototype.gd src/main/ProgressionMain.gd src/progression/AirportProgressionStore.gd tests/career_gameplay_integration_test.gd tests/career_progression_rules_test.gd
          git commit -m 'Fix NPC lifecycle cleanup and keep busy-airport UI responsive'
          git pull --rebase origin feature/pass5-npc-career-progression
          git push origin HEAD:feature/pass5-npc-career-progression
