name: Validate career and NPC gameplay
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  progression:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Strict project import
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit > /tmp/skyport-progression-import.log 2>&1
          tail -n 35 /tmp/skyport-progression-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-import.log; then exit 1; fi
      - name: Career rules and NPC gates
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/career_progression_rules_test.gd > /tmp/skyport-progression-rules.log 2>&1
          cat /tmp/skyport-progression-rules.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-rules.log; then exit 1; fi
          grep -q 'PROGRESSION_TEST_OK' /tmp/skyport-progression-rules.log
      - name: Real main-scene gameplay and save reload
        shell: bash
        run: |
          set -o pipefail
          timeout 150s godot --headless --path . --script res://tests/career_gameplay_integration_test.gd > /tmp/skyport-progression-gameplay.log 2>&1
          cat /tmp/skyport-progression-gameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-gameplay.log; then exit 1; fi
          grep -q 'PROGRESSION_TEST_OK' /tmp/skyport-progression-gameplay.log
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-diagnostics
          path: /tmp/skyport-progression-*.log
          retention-days: 7
