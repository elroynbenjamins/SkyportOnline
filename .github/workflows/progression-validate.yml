name: Validate progression, missions and NPC gameplay
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  progression:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scoped reproduction fixture
        if: github.event.pull_request.head.ref == 'feature/pass5-npc-career-progression'
        shell: bash
        run: |
          mkdir -p /tmp/progression-runtime
          cp "$(command -v godot)" /tmp/progression-runtime/godot
          tar -czf /tmp/progression-runtime/project.tgz --exclude=.git --exclude=.godot .
      - name: Keep scoped reproduction fixture
        if: github.event.pull_request.head.ref == 'feature/pass5-npc-career-progression'
        uses: actions/upload-artifact@v4
        with:
          name: progression-reproduction
          path: /tmp/progression-runtime/
          retention-days: 1
      - name: Strict project import
        shell: bash
        run: |
          set -o pipefail
          status=0
          godot --headless --editor --path . --quit > /tmp/skyport-progression-import.log 2>&1 || status=$?
          tail -n 45 /tmp/skyport-progression-import.log
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-import.log; then exit 1; fi
      - name: Career rules and NPC gates
        shell: bash
        run: |
          status=0
          timeout 45s godot --headless --path . --script res://tests/career_progression_rules_test.gd > /tmp/skyport-progression-rules.log 2>&1 || status=$?
          cat /tmp/skyport-progression-rules.log
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-rules.log; then exit 1; fi
          grep -q 'PROGRESSION_TEST_OK' /tmp/skyport-progression-rules.log
      - name: Daily weekly mission and Airport Pass rules
        shell: bash
        run: |
          status=0
          timeout 60s godot --headless --path . --script res://tests/mission_pass_rules_test.gd > /tmp/skyport-progression-missions.log 2>&1 || status=$?
          cat /tmp/skyport-progression-missions.log
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-missions.log; then exit 1; fi
          grep -q 'MISSION_PASS_TEST_OK' /tmp/skyport-progression-missions.log
      - name: Real main-scene gameplay and save reload
        shell: bash
        run: |
          status=0
          timeout 150s godot --headless --path . --script res://tests/career_gameplay_integration_test.gd > /tmp/skyport-progression-gameplay.log 2>&1 || status=$?
          cat /tmp/skyport-progression-gameplay.log
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/skyport-progression-gameplay.log; then exit 1; fi
          grep -q 'PROGRESSION_TEST_OK' /tmp/skyport-progression-gameplay.log
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-diagnostics
          path: /tmp/skyport-progression-*.log
          retention-days: 7
