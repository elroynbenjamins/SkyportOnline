<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="480" viewBox="0 0 1024 480">
<defs>
  <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#566168"/><stop offset=".45" stop-color="#3d484e"/><stop offset="1" stop-color="#2d373c"/>
  </linearGradient>
  <linearGradient id="shoulder" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8c8e89"/><stop offset="1" stop-color="#5f6565"/>
  </linearGradient>
</defs>
<!-- fixed sunlight upper-left, shadow lower-right -->
<polygon points="76,300 273,137 947,201 750,365 126,334" fill="#172328" opacity=".30"/>
<polygon points="57,267 258,111 954,176 749,340 80,304" fill="url(#shoulder)"/>
<polygon points="78,257 270,124 931,186 742,321 101,292" fill="url(#asphalt)"/>
<!-- subtle pavement panels -->
<g stroke="#69747a" stroke-width="3" opacity=".33">
  <line x1="220" y1="143" x2="168" y2="281"/><line x1="358" y1="138" x2="303" y2="298"/>
  <line x1="500" y1="152" x2="444" y2="309"/><line x1="646" y1="166" x2="589" y2="320"/>
  <line x1="790" y1="180" x2="735" y2="320"/>
</g>
<!-- edge lines -->
<polyline points="101,246 276,133 918,193" fill="none" stroke="#f2f0e3" stroke-width="8" opacity=".96"/>
<polyline points="110,288 742,314 910,204" fill="none" stroke="#f2f0e3" stroke-width="8" opacity=".96"/>
<!-- centerline -->
<g stroke="#f8f6e9" stroke-width="8" stroke-linecap="round">
  <line x1="254" y1="238" x2="321" y2="222"/><line x1="367" y1="211" x2="436" y2="203"/>
  <line x1="482" y1="200" x2="552" y2="202"/><line x1="599" y1="206" x2="669" y2="216"/>
  <line x1="715" y1="226" x2="780" y2="243"/>
</g>
<!-- threshold blocks -->
<g fill="#f7f5e8">
  <polygon points="121,235 155,214 179,219 145,241"/><polygon points="137,250 171,229 195,234 161,256"/>
  <polygon points="153,266 187,245 211,250 177,272"/><polygon points="169,280 203,259 227,264 193,286"/>
  <polygon points="810,239 844,249 820,265 786,255"/><polygon points="827,227 861,237 837,253 803,243"/>
  <polygon points="844,215 878,225 854,241 820,231"/><polygon points="861,203 895,213 871,229 837,219"/>
</g>
<!-- aiming point bars -->
<g fill="#f7f5e8">
  <polygon points="302,178 367,184 349,197 284,191"/><polygon points="291,267 356,271 338,285 273,281"/>
  <polygon points="670,197 735,203 717,216 652,210"/><polygon points="659,281 724,285 706,299 641,295"/>
</g>
<!-- runway number -->
<text x="208" y="228" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f7f5e8" transform="rotate(-18 208 228)">09</text>
<!-- inset drains / wear -->
<g fill="#222d31" opacity=".72">
  <rect x="402" y="263" width="28" height="8" rx="3" transform="rotate(3 416 267)"/>
  <rect x="570" y="175" width="24" height="7" rx="3" transform="rotate(5 582 178)"/>
</g>
<!-- blue edge lights -->
<g fill="#15252b" stroke="#69c8f0" stroke-width="3">
  <circle cx="145" cy="216" r="6"/><circle cx="261" cy="146" r="6"/><circle cx="390" cy="150" r="6"/>
  <circle cx="526" cy="163" r="6"/><circle cx="664" cy="176" r="6"/><circle cx="802" cy="189" r="6"/><circle cx="904" cy="198" r="6"/>
  <circle cx="157" cy="285" r="6"/><circle cx="292" cy="294" r="6"/><circle cx="430" cy="300" r="6"/>
  <circle cx="568" cy="305" r="6"/><circle cx="704" cy="311" r="6"/><circle cx="825" cy="259" r="6"/>
