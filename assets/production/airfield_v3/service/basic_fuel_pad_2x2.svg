<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <defs>
    <clipPath id="footprint"><polygon points="64,0 128,32 64,64 0,32"/></clipPath>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd7c8"/>
      <stop offset=".55" stop-color="#c2b9a7"/>
      <stop offset="1" stop-color="#9b9387"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58636a"/>
      <stop offset=".55" stop-color="#424c52"/>
      <stop offset="1" stop-color="#30393f"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#footprint)">
    <polygon points="64,0 128,32 64,64 0,32" fill="url(#concrete)"/>
    <polygon points="64,4 120,32 64,60 8,32" fill="#7f786f" opacity=".34"/>
    <polygon points="64,8 111,31.5 64,55 17,31.5" fill="url(#service)"/>

    <!-- grid-safe service bay -->
    <path d="M26 32 L64 13 L102 32 L64 51 Z" fill="none" stroke="#d6c9a5" stroke-width="1.25" opacity=".55"/>
    <path d="M35 32 L64 17.5 L93 32 L64 46.5 Z" fill="none" stroke="#f2c84b" stroke-width="1.7" stroke-dasharray="5 3"/>
    <path d="M64 18 L64 46" stroke="#f2c84b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- compact fuel-island cues behind the aircraft slot -->
    <ellipse cx="45" cy="21.5" rx="6.8" ry="3.4" fill="#30383d" opacity=".55"/>
    <ellipse cx="45" cy="20" rx="5.6" ry="2.8" fill="#d6aa47"/>
    <rect x="41.8" y="15.8" width="6.4" height="5.2" rx="1.3" fill="#e7c36d"/>
    <path d="M49 17.5 C55 18 55 23 58 25" fill="none" stroke="#24323a" stroke-width="1.3"/>

    <ellipse cx="83" cy="21.5" rx="6.8" ry="3.4" fill="#30383d" opacity=".55"/>
    <ellipse cx="83" cy="20" rx="5.6" ry="2.8" fill="#d6aa47"/>
    <rect x="79.8" y="15.8" width="6.4" height="5.2" rx="1.3" fill="#e7c36d"/>

    <!-- blue bay lights -->
    <g fill="#65dcff" stroke="#efffff" stroke-width=".45">
      <circle cx="28" cy="32" r="1.5"/>
      <circle cx="64" cy="50" r="1.5"/>
      <circle cx="100" cy="32" r="1.5"/>
      <circle cx="64" cy="14" r="1.5"/>
    </g>
