<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="112" viewBox="0 0 224 112">
  <defs>
    <clipPath id="footprint"><polygon points="64,0 224,80 160,112 0,32"/></clipPath>
    <linearGradient id="curb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead9b7"/>
      <stop offset=".48" stop-color="#cdb792"/>
      <stop offset="1" stop-color="#9f8c72"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#535c64"/>
      <stop offset=".46" stop-color="#414a51"/>
      <stop offset="1" stop-color="#2f383f"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset=".32" stop-color="#58ddff"/>
      <stop offset=".68" stop-color="#129cff"/>
      <stop offset="1" stop-color="#1262d6" stop-opacity=".15"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#footprint)">
    <!-- Exact 5x2 projected footprint; no grass or overhang. -->
    <polygon points="64,0 224,80 160,112 0,32" fill="url(#curb)"/>
    <polygon points="67,3 218,79 157,109 6,33" fill="#766b5c" opacity=".72"/>
    <polygon points="73,8 208,76 152,104 17,36" fill="url(#asphalt)"/>

    <!-- Asphalt depth / wear. -->
    <polygon points="82,14 198,72 144,99 28,41" fill="#738089" opacity=".055"/>
    <path d="M40 39 L151 95" stroke="#11191f" stroke-width="4.3" opacity=".12" fill="none" stroke-linecap="round"/>
    <path d="M59 25 L185 88" stroke="#7b858c" stroke-width="2.1" opacity=".10" fill="none" stroke-linecap="round"/>
    <path d="M75 34 L162 78" stroke="#1f282e" stroke-width="1.5" opacity=".14" fill="none"/>

    <!-- Fine runway edge lines. -->
    <path d="M79 12 L204 75" stroke="#e9e8df" stroke-width="1.15" opacity=".72" fill="none"/>
    <path d="M21 37 L146 100" stroke="#e9e8df" stroke-width="1.15" opacity=".72" fill="none"/>

    <!-- START threshold at origin side. -->
    <g fill="#f7f4ea">
      <polygon points="42,24 49,27.5 45,31 38,27.5"/>
      <polygon points="49.5,28 56.5,31.5 52.5,35 45.5,31.5"/>
      <polygon points="57,32 64,35.5 60,39 53,35.5"/>
      <polygon points="64.5,36 71.5,39.5 67.5,43 60.5,39.5"/>
    </g>

    <!-- END threshold, visually distinct rollout end. -->
    <g fill="#f7f4ea">
      <polygon points="154,76 161,79.5 157,83 150,79.5"/>
      <polygon points="161.5,80 168.5,83.5 164.5,87 157.5,83.5"/>
      <polygon points="169,84 176,87.5 172,91 165,87.5"/>
      <polygon points="176.5,88 183.5,91.5 179.5,95 172.5,91.5"/>
    </g>

    <!-- Compact centerline / aiming marks. -->
    <g fill="#f7f4ea">
      <polygon points="76,41 87,46.5 83.5,50 72.5,44.5"/>
      <polygon points="98,52 109,57.5 105.5,61 94.5,55.5"/>
      <polygon points="120,63 131,68.5 127.5,72 116.5,66.5"/>
      <polygon points="142,74 153,79.5 149.5,83 138.5,77.5"/>
      <polygon points="87,45.5 98,51 93.5,55.3 82.5,49.8" opacity=".95"/>
      <polygon points="132,68 143,73.5 138.5,77.8 127.5,72.3" opacity=".95"/>
    </g>

    <!-- Blue inset runway lights, concept-level but grid-safe. -->
    <g>
      <g><ellipse cx="87" cy="14" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="87" cy="14" r="3.2" fill="url(#blueGlow)"/><circle cx="87" cy="14" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="113" cy="27" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="113" cy="27" r="3.2" fill="url(#blueGlow)"/><circle cx="113" cy="27" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="139" cy="40" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="139" cy="40" r="3.2" fill="url(#blueGlow)"/><circle cx="139" cy="40" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="165" cy="53" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="165" cy="53" r="3.2" fill="url(#blueGlow)"/><circle cx="165" cy="53" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="36" cy="43" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="36" cy="43" r="3.2" fill="url(#blueGlow)"/><circle cx="36" cy="43" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="62" cy="56" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="62" cy="56" r="3.2" fill="url(#blueGlow)"/><circle cx="62" cy="56" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="88" cy="69" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="88" cy="69" r="3.2" fill="url(#blueGlow)"/><circle cx="88" cy="69" r=".85" fill="#efffff"/></g>
      <g><ellipse cx="114" cy="82" rx="5.1" ry="3.2" fill="#262a2c" opacity=".72"/><circle cx="114" cy="82" r="3.2" fill="url(#blueGlow)"/><circle cx="114" cy="82" r=".85" fill="#efffff"/></g>
    </g>

    <!-- Small warm runway-end lamps away from taxi sockets. -->
    <g fill="#ff8059" stroke="#ffd6bd" stroke-width=".5">
      <circle cx="73" cy="8" r="1.45"/><circle cx="17" cy="36" r="1.45"/>
      <circle cx="208" cy="76" r="1.45"/><circle cx="152" cy="104" r="1.45"/>
    </g>
  </g>
</svg>