<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="112" viewBox="0 0 224 112">
  <defs>
    <clipPath id="footprint"><polygon points="64,0 224,80 160,112 0,32"/></clipPath>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88c84d"/><stop offset="1" stop-color="#5d9a3d"/>
    </linearGradient>
    <linearGradient id="curb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c7a8"/><stop offset="1" stop-color="#ad9e86"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#485057"/><stop offset=".55" stop-color="#343c43"/><stop offset="1" stop-color="#2b3339"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#footprint)">
    <!-- Exact 5x2 grid footprint: (64,0) (224,80) (160,112) (0,32). -->
    <polygon points="64,0 224,80 160,112 0,32" fill="url(#grass)"/>
    <polygon points="67,3 218,79 157,109 6,33" fill="#567d36" opacity=".38"/>
    <polygon points="70,6 212,77 154,106 12,35" fill="url(#curb)"/>
    <polygon points="75,10 204,75 149,102 20,37" fill="#756f68"/>
    <polygon points="79,13 198,73 145,99 26,39" fill="url(#asphalt)"/>

    <!-- Restrained asphalt panel/wear detail. -->
    <g opacity=".16" fill="none" stroke-linecap="round">
      <path d="M42 39 L168 102" stroke="#151b20" stroke-width="5"/>
      <path d="M57 23 L187 88" stroke="#626b71" stroke-width="2.5"/>
      <path d="M84 30 L174 75" stroke="#222a2f" stroke-width="1.8"/>
      <path d="M49 48 L141 94" stroke="#566067" stroke-width="1.5"/>
    </g>

    <!-- Thin edge lines. -->
    <path d="M82 16 L194 72" fill="none" stroke="#ecebe1" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M30 40 L142 96" fill="none" stroke="#ecebe1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Short, clean threshold bars: no oversized white T markings. -->
    <g fill="#f4f1e6">
      <polygon points="45,25 51,28 47,31 41,28"/>
      <polygon points="51,28 57,31 53,34 47,31"/>
      <polygon points="57,31 63,34 59,37 53,34"/>
      <polygon points="161,78 167,81 163,84 157,81"/>
      <polygon points="167,81 173,84 169,87 163,84"/>
      <polygon points="173,84 179,87 175,90 169,87"/>
    </g>

    <!-- Compact centerline and aiming blocks. -->
    <g fill="#f4f1e6">
      <polygon points="73,41 84,46 81,49 70,44"/>
      <polygon points="94,51 105,56 102,59 91,54"/>
      <polygon points="115,62 126,67 123,70 112,65"/>
      <polygon points="136,72 147,77 144,80 133,75"/>
      <polygon points="83,45 94,50 90,54 79,49" opacity=".96"/>
      <polygon points="130,69 141,74 137,78 126,73" opacity=".96"/>
    </g>

    <!-- Warm concept-style inset edge lights, all inside the footprint. -->
    <g fill="#ffd36d" stroke="#fff1b0" stroke-width=".7">
      <circle cx="88" cy="15" r="2.1"/><circle cx="113" cy="28" r="2.1"/><circle cx="139" cy="41" r="2.1"/>
      <circle cx="165" cy="54" r="2.1"/><circle cx="190" cy="67" r="2.1"/>
      <circle cx="34" cy="43" r="2.1"/><circle cx="59" cy="56" r="2.1"/><circle cx="85" cy="69" r="2.1"/>
      <circle cx="111" cy="82" r="2.1"/><circle cx="136" cy="95" r="2.1"/>
    </g>

    <!-- Tiny grass accents stay inside the 5x2 mask. -->
    <g fill="#3f7f36" opacity=".75">
      <circle cx="48" cy="14" r="1.7"/><circle cx="52" cy="13" r="1.2"/>
      <circle cx="180" cy="92" r="1.6"/><circle cx="185" cy="90" r="1.1"/>
      <circle cx="15" cy="29" r="1.4"/><circle cx="208" cy="78" r="1.3"/>
    </g>
  </g>
</svg>