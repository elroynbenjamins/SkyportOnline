<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <defs>
    <linearGradient id="curb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#decbaa"/>
      <stop offset="1" stop-color="#aa9a81"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#515a60"/>
      <stop offset=".55" stop-color="#3d474d"/>
      <stop offset="1" stop-color="#303940"/>
    </linearGradient>
    <clipPath id="tile"><polygon points="32,0 64,16 32,32 0,16"/></clipPath>
  </defs>

  <!-- Exact 1x1 projected grid diamond. -->
  <g clip-path="url(#tile)">
    <polygon points="32,0 64,16 32,32 0,16" fill="url(#curb)"/>
    <polygon points="32,3 58,16 32,29 6,16" fill="#6f6a63"/>
    <polygon points="32,5 54,16 32,27 10,16" fill="url(#asphalt)"/>

    <!-- Very subtle material variation; connections are drawn dynamically. -->
    <path d="M15 16 L32 7 L49 16 L32 25 Z"
          fill="#667177" opacity=".10"/>
    <path d="M9 15 L32 3 L55 15"
          fill="none" stroke="#f2eadb" stroke-opacity=".28" stroke-width=".8"/>

    <!-- Small center guide knot so multi-way joins stay clean. -->
    <circle cx="32" cy="16" r="1.7" fill="#f0c84f"/>
    <circle cx="32" cy="16" r=".7" fill="#fff1a6"/>
  </g>
</svg>